name: PR verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "1"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify
        env:
          VERIFY_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/verify.sh verify

      - name: Audit dependencies
        run: ./scripts/verify.sh audit

      - name: Verify published hosted client boot assets
        run: ./scripts/verify.sh publish

      - name: Verify browser session and diary lifecycle
        run: node --test tests/FitnessApp.IntegrationTests/*.test.cjs

      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/FitnessApp.BrowserTests/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: tests/FitnessApp.BrowserTests
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium

      - name: Verify registration and navigation in Chromium
        working-directory: tests/FitnessApp.BrowserTests
        run: npm test

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-browser-evidence
          path: |
            tests/FitnessApp.BrowserTests/test-results/**/*.png
            tests/FitnessApp.BrowserTests/test-results/**/failure-trace.json
          retention-days: 14
          if-no-files-found: ignore
