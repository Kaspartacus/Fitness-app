apiVersion: 1
prune: true
datasources:
  - name: FitnessApp Loki
    uid: fitnessapp-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: Related request logs
          matcherRegex: '"traceId":"([^"\\]+)"'
          url: '/d/fitnessapp-logs/fitnessapp-logs?var-environment=All&var-severity=All&var-category=.*&var-traceId=$${__value.raw}&from=now-3h&to=now'
          urlDisplayLabel: Related request logs
