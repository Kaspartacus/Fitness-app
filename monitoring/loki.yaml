auth_enabled: false # Isolated Compose network only; no published Loki port.
server:
  http_listen_port: 3100
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 1h
  delete_request_store: filesystem
limits_config:
  retention_period: 72h
  ingestion_rate_mb: 0.02
  ingestion_burst_size_mb: 1
  max_line_size: 64KB
  max_query_lookback: 72h
  max_query_parallelism: 2
  split_queries_by_interval: 1h
  max_global_streams_per_user: 100
  discover_service_name: []
ingester:
  chunk_idle_period: 5m
  max_chunk_age: 1h
  wal:
    dir: /loki/wal
    replay_memory_ceiling: 64MB
    flush_on_shutdown: true
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32
analytics:
  reporting_enabled: false
